<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contract Review</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 14l2 2 4-4"/></svg>
      </span>
      <span class="brand-name">Contract Review</span>
    </div>
    <div class="topbar-actions">
      <span id="file-name" class="file-name" hidden></span>
      <button id="replace-btn" type="button" class="btn-outline" hidden>Replace file</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel contract-panel" aria-label="Contract preview">
      <div class="panel-header">
        <h2>Contract</h2>
        <span id="file-meta" class="file-meta"></span>
      </div>

      <div id="drop-zone" class="drop-zone" tabindex="0" role="button" aria-label="Upload a PDF contract">
        <div class="drop-icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        </div>
        <p class="drop-title">Upload a contract</p>
        <p class="drop-sub">Drag and drop a PDF here, or click to browse</p>
        <span class="btn-primary">Choose PDF</span>
      </div>
      <input id="file-input" type="file" accept="application/pdf,.pdf" hidden>

      <p id="upload-error" class="error" role="alert" hidden></p>

      <div id="viewer-wrap" class="viewer-wrap" hidden>
        <iframe id="pdf-viewer" class="pdf-viewer" title="Contract PDF"></iframe>
      </div>
    </section>

    <section class="panel chat-panel" aria-label="Chat">
      <div class="panel-header">
        <h2>Ask about this contract</h2>
        <span class="badge">Simulated</span>
      </div>

      <div id="messages" class="messages" aria-live="polite">
        <div class="message assistant">Upload a contract, then ask me questions about it.</div>
      </div>

      <form id="chat-form" class="chat-form" autocomplete="off">
        <label for="chat-input" class="sr-only">Message</label>
        <input id="chat-input" type="text" placeholder="Ask a question about the contract">
        <button id="send-btn" type="submit" class="btn-accent" disabled>
          Send
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
        </button>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
